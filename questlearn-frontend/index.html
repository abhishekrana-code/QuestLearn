<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6F0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="QuestLearn turns a course into a guided path: short lessons, instant quizzes, and progress you can actually see."
    />
    <title>QuestLearn: A clearer way to learn</title>

    <!-- No font CDN: the app ships with system stacks, so a page cannot hang on a
         third-party request and the Content-Security-Policy can stay 'self'. -->

    <!-- External rather than inline so the production policy can say
         script-src 'self' with no 'unsafe-inline'. Blocking on purpose: it has to
         set the theme before the first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
