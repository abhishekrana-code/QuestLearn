<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6F0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="QuestLearn turns a course into a guided path: short lessons, instant quizzes, and progress you can actually see."
    />
    <title>QuestLearn — A clearer way to learn</title>

    <!-- No font CDN: the app ships with system stacks, so a page cannot hang on a
         third-party request and the Content-Security-Policy can stay 'self'. -->

    <script>
      // Paint the right theme before React mounts. Light is the product default;
      // an explicit choice or the OS preference wins from there.
      (function () {
        try {
          var stored = localStorage.getItem('questlearn.theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (stored === 'system') {
            theme = prefersLight ? 'light' : 'dark';
          } else {
            theme = 'light';
          }
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#FAF6F0' : '#141212');
        } catch (error) {
          /* storage blocked: keep the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
