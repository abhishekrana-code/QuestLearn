# QuestLearn security headers.
#
# Include this from every server block that serves the app, including the TLS
# block certbot adds (`nginx -t` will fail if the file is missing):
#
#     include /etc/nginx/snippets/questlearn-headers.conf;
#
# The policy is written for this app specifically:
#   * script-src needs 'unsafe-inline' for the small theme bootstrap in index.html
#     that paints the right colours before React mounts. Everything else is a
#     same-origin module.
#   * style-src needs 'unsafe-inline' because Tailwind writes layout values into
#     style attributes (progress bars, skill-tree positions).
#   * img-src allows data: and blob: for avatars and canvas output; media-src
#     allows blob: for the voice-viva recorder's local playback.
#   * frame-src allows the YouTube embed used by a node's lesson video.
#   * There is no font CDN, so font-src stays 'self'.
#
#   * script-src is 'self' only: the theme bootstrap moved to /theme-init.js so no
#     inline script is needed. React and the bundled chunks are same-origin, and
#     there is no analytics or tag manager to allow.
#   * style-src keeps 'unsafe-inline' because components set inline style attributes
#     for positions and progress widths; that is a styling capability, not a script
#     one, and it cannot inject code.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Only meaningful over HTTPS: browsers ignore it on plain HTTP, so including it in
# the port-80 block costs nothing and it starts working as soon as the TLS block
# serves the same include. includeSubDomains is safe for a single host; drop it if
# the certificate does not cover subdomains.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Nothing here needs a camera, microphone or location (the viva recorder captures
# audio in the browser and uploads a blob, which needs no permission header).
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
