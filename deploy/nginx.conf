# QuestLearn site config.
# Install as /etc/nginx/sites-available/questlearn.conf, then symlink into
# sites-enabled, run `nginx -t`, reload, and issue the certificate with certbot
# (which rewrites this file to add the TLS server block).

# Coarse per-IP backstop for credential stuffing. The application also locks a
# single account after repeated failures; this protects the endpoint globally.
limit_req_zone $binary_remote_addr zone=questlearn_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name questlearn.example.com;

    root /var/www/questlearn;
    index index.html;
    # Two uploads go through here: viva recordings (capped at 8 MB in prod by the
    # app) and instructor lesson videos (up to MEDIA_MAX_UPLOAD, 110 MB). The proxy
    # must be the larger of the two or a video upload fails before the app sees it.
    client_max_body_size 120m;

    # Static assets are content-hashed by Vite, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/v1/auth/login {
        limit_req zone=questlearn_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Used by uptime monitors; keep it out of the access log.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # Client-side routing: unknown paths must still return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
