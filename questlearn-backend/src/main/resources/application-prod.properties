# ---------------------------------------------------------------------------
# QuestLearn backend - production profile (SPRING_PROFILES_ACTIVE=prod)
# ---------------------------------------------------------------------------
# Everything here is intentionally strict: a missing secret or origin should stop
# the app at startup rather than silently fall back to a development default.

# No default secret. Startup fails if JWT_SECRET is not supplied.
questlearn.jwt.secret=${JWT_SECRET}

# No localhost fallback. Set the real frontend origin(s), comma separated.
questlearn.cors.allowed-origins=${CORS_ORIGINS}

# Trust X-Forwarded-* from the nginx reverse proxy so redirects and CORS use https.
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# Interactive API docs are for development; they stay off in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Log to a file so journald/nginx are not the only record of what happened.
logging.file.name=${LOG_FILE:logs/questlearn.log}
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=10MB
