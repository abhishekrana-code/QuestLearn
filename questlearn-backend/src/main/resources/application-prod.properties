# ---------------------------------------------------------------------------
# QuestLearn backend - production profile (SPRING_PROFILES_ACTIVE=prod)
# ---------------------------------------------------------------------------
# Everything here is intentionally strict: a missing secret or origin should stop
# the app at startup rather than silently fall back to a development default.

# No default secret. Startup fails if JWT_SECRET is not supplied.
questlearn.jwt.secret=${JWT_SECRET}

# No localhost fallback. Set the real frontend origin(s), comma separated.
questlearn.cors.allowed-origins=${CORS_ORIGINS}

# --- Registration -----------------------------------------------------------
# Public student sign-up is closed unless an institution code is configured, and
# an unset code fails closed instead of letting the whole internet register.
questlearn.registration.require-student-code=true

# --- Bootstrap administrator ------------------------------------------------
# Read once, on the first start of an empty database, by BootstrapAdminRunner.
# Remove BOOTSTRAP_ADMIN_PASSWORD from the environment afterwards.
questlearn.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
questlearn.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:Administrator}
questlearn.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}

# --- Runtime ----------------------------------------------------------------
# Finish in-flight vivas on stop instead of cutting the response off.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# The demo serves 10-20 people from one machine; a slightly larger pool removes
# connection queueing without starving PostgreSQL.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# An 80 second Opus recording is about 1 MB, so 8 MB is generous while keeping a
# few simultaneous uploads inside the JVM heap.
spring.servlet.multipart.max-file-size=${AI_MAX_UPLOAD:8MB}
spring.servlet.multipart.max-request-size=${AI_MAX_REQUEST:9MB}
questlearn.ai.max-audio-bytes=${AI_MAX_AUDIO_BYTES:8388608}

# Eight hours: long enough for a class, short enough to limit a stolen token.
questlearn.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
