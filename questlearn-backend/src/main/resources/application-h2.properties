# ---------------------------------------------------------------------------
# Optional zero-setup profile:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Stores everything in ./data/questlearn.mv.db so the demo survives restarts.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/questlearn;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
