# ---------------------------------------------------------------------------
# QuestLearn backend - default (PostgreSQL) configuration
# ---------------------------------------------------------------------------
spring.application.name=questlearn

# Local, gitignored configuration (.env): DB credentials, JWT secret, CORS.
# Read from the working directory and from its parent so the app works whether
# it is started from questlearn-backend/ or from the repository root.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# --- PostgreSQL ------------------------------------------------------------
# Create the database once:
#   createdb -U postgres questlearn
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/questlearn}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP kept deliberately small for 8GB RAM laptops.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# --- Hibernate / JPA -------------------------------------------------------
# The schema belongs to Flyway (src/main/resources/db/migration). Validate only:
# a drifted schema fails fast at startup instead of being silently mutated.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- Flyway ----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Databases created by an earlier Hibernate run already have the schema; baseline
# them at V1 instead of trying to re-run the baseline script. Empty databases
# apply V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- JWT -------------------------------------------------------------------
# Override with a >= 32 character secret in production.
questlearn.jwt.secret=${JWT_SECRET:questlearn-dev-secret-key-change-me-in-production-0123456789}
questlearn.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ------------------------------------------------------------------
questlearn.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Registration ----------------------------------------------------------
# Self-service signup is student-only. Instructors need this invite code; when it
# is blank, instructor self-registration is disabled entirely.
questlearn.registration.instructor-invite-code=${INSTRUCTOR_INVITE_CODE:}
# Institution code for student sign-up. Local development leaves it blank so the
# app stays easy to try; production requires it (see application-prod.properties).
questlearn.registration.student-invite-code=${STUDENT_INVITE_CODE:}
questlearn.registration.require-student-code=${REQUIRE_STUDENT_CODE:false}

# --- Login throttling ------------------------------------------------------
# Per-email lockout after repeated failures. In-memory: correct for one instance.
questlearn.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
questlearn.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# --- Groq AI (voice viva + AI course authoring) ----------------------------
# The key never reaches the browser: the React client only calls this API.
# Without a key the AI features answer 503 with a clear message, and every other
# part of the LMS keeps working.
questlearn.ai.groq-api-key=${GROQ_API_KEY:}
questlearn.ai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
questlearn.ai.reasoning-model=${GROQ_REASONING_MODEL:openai/gpt-oss-120b}
questlearn.ai.transcription-model=${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
# Cost guard: AI calls per account per rolling hour (viva attempts + generations).
questlearn.ai.hourly-limit=${AI_HOURLY_LIMIT:30}
# Groq accepts 25 MB uploads for whisper; keep the two in step.
questlearn.ai.max-audio-bytes=${AI_MAX_AUDIO_BYTES:26214400}
spring.servlet.multipart.max-file-size=${AI_MAX_UPLOAD:25MB}
spring.servlet.multipart.max-request-size=${AI_MAX_REQUEST:27MB}

# --- Actuator --------------------------------------------------------------
# Only health is exposed; it is the one endpoint an uptime probe needs.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- OpenAPI ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Misc ------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
logging.level.org.hibernate.SQL=warn
logging.level.com.questlearn=INFO
