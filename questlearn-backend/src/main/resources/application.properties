# ---------------------------------------------------------------------------
# QuestLearn backend - default (PostgreSQL) configuration
# ---------------------------------------------------------------------------
spring.application.name=questlearn

# Local, gitignored configuration (.env): DB credentials, JWT secret, CORS.
# Read from the working directory and from its parent so the app works whether
# it is started from questlearn-backend/ or from the repository root.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# --- PostgreSQL ------------------------------------------------------------
# Create the database once:
#   createdb -U postgres questlearn
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/questlearn}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP kept deliberately small for 8GB RAM laptops.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# --- Hibernate / JPA -------------------------------------------------------
# The schema belongs to Flyway (src/main/resources/db/migration). Validate only:
# a drifted schema fails fast at startup instead of being silently mutated.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- Flyway ----------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Databases created by an earlier Hibernate run already have the schema; baseline
# them at V1 instead of trying to re-run the baseline script. Empty databases
# apply V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- JWT -------------------------------------------------------------------
# Override with a >= 32 character secret in production.
questlearn.jwt.secret=${JWT_SECRET:questlearn-dev-secret-key-change-me-in-production-0123456789}
questlearn.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ------------------------------------------------------------------
questlearn.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# --- Demo seed data --------------------------------------------------------
# The shared password for the five seeded demo accounts. A local checkout keeps the
# built-in default; DEMO_PASSWORD on anything the internet can reach, because the
# seeder rewrites those accounts to this value on each start and the published
# default would otherwise be the only thing between a stranger and the admin login.
questlearn.demo.password=${DEMO_PASSWORD:password123}

# --- Registration ----------------------------------------------------------
# Self-service signup is student-only. Instructors need this invite code; when it
# is blank, instructor self-registration is disabled entirely.
questlearn.registration.instructor-invite-code=${INSTRUCTOR_INVITE_CODE:}
# Institution code for student sign-up. Local development leaves it blank so the
# app stays easy to try; production requires it (see application-prod.properties).
questlearn.registration.student-invite-code=${STUDENT_INVITE_CODE:}
questlearn.registration.require-student-code=${REQUIRE_STUDENT_CODE:false}

# --- Email (password recovery + address confirmation) ----------------------
# Where the emailed links point: the browser origin students use.
questlearn.auth.app-base-url=${APP_BASE_URL:http://localhost:5173}
# The From address on every transactional email.
questlearn.email.from=${MAIL_FROM:no-reply@questlearn.dev}

# Password recovery links are single-use and expire after this many minutes.
questlearn.auth.reset-token-minutes=${RESET_TOKEN_MINUTES:30}
# Reset emails one address may ask for in a rolling hour.
questlearn.auth.reset-max-per-hour=${RESET_MAX_PER_HOUR:3}

# Address-confirmation links are single-use and expire after this many hours.
questlearn.auth.verification-token-hours=${VERIFICATION_TOKEN_HOURS:48}
# Confirmation emails one signed-in account may ask for in a rolling hour.
questlearn.auth.verification-max-per-hour=${VERIFICATION_MAX_PER_HOUR:3}

# Which transport carries that mail. auto = Resend when RESEND_API_KEY is set,
# SMTP when MAIL_HOST is set, otherwise the server log. Force one with
# EMAIL_PROVIDER=resend|smtp|log; asking for an unconfigured one fails at startup.
questlearn.email.provider=${EMAIL_PROVIDER:auto}
questlearn.email.resend-api-key=${RESEND_API_KEY:}
questlearn.email.resend-base-url=${RESEND_BASE_URL:https://api.resend.com}

# Optional SMTP. With MAIL_HOST blank and no Resend key, links are written to
# the server log at WARN so an operator can hand them over on a demo machine.
spring.mail.host=${MAIL_HOST:}

# --- Deadline reminders ------------------------------------------------------
# The daily digest is off unless this is explicitly switched on. A local demo
# should not write a digest into the log every morning, and enabling mail is an
# operational decision. The cron is UTC.
questlearn.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
questlearn.notifications.cron=${NOTIFICATIONS_CRON:0 0 7 * * *}
# A deadline is "due soon" inside this many days, on every screen and in the digest.
questlearn.notifications.due-soon-days=${NOTIFICATIONS_DUE_SOON_DAYS:7}
# How long the reminder ledger keeps a sent row. Long enough to survive a deadline
# being moved back by a term; short enough not to grow forever.
questlearn.notifications.retention-days=${NOTIFICATIONS_RETENTION_DAYS:120}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# A hung SMTP server must not hold a request thread open.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Login throttling ------------------------------------------------------
# Per-email lockout after repeated failures. In-memory: correct for one instance.
questlearn.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
questlearn.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}

# --- Groq AI (voice viva + AI course authoring) ----------------------------
# The key never reaches the browser: the React client only calls this API.
# Without a key the AI features answer 503 with a clear message, and every other
# part of the LMS keeps working.
questlearn.ai.groq-api-key=${GROQ_API_KEY:}
questlearn.ai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
questlearn.ai.reasoning-model=${GROQ_REASONING_MODEL:openai/gpt-oss-120b}
# Retried once when the reasoning model is rate-limited; it has its own Groq bucket.
questlearn.ai.fallback-model=${GROQ_FALLBACK_MODEL:openai/gpt-oss-20b}
questlearn.ai.transcription-model=${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
# Cost guards: a deployment-wide cap per calendar day, so the free tier cannot be
# exhausted however many accounts exist, plus a per-account rolling hour.
questlearn.ai.daily-limit=${AI_DAILY_LIMIT:150}
questlearn.ai.hourly-limit=${AI_HOURLY_LIMIT:30}
# Answers graded at the same time. Each spoken attempt holds its audio in the heap.
questlearn.ai.max-concurrent-vivas=${AI_MAX_CONCURRENT_VIVAS:4}
# Groq accepts 25 MB uploads for whisper; keep the two in step.
questlearn.ai.max-audio-bytes=${AI_MAX_AUDIO_BYTES:26214400}
# The multipart ceiling is a transport limit for lesson-video uploads; the audio
# rule above is what actually rejects a long recording, and it stays much smaller.
spring.servlet.multipart.max-file-size=${MEDIA_MAX_UPLOAD:110MB}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST:120MB}

# --- Lesson media -----------------------------------------------------------
# Videos are streamed to disk, never into the heap or the database.
# disk (default) needs no account; s3 means any S3-compatible bucket. Selecting s3
# without the four values below stops startup with a message that names the gap.
questlearn.media.storage=${MEDIA_STORAGE:disk}
questlearn.media.video-dir=${MEDIA_VIDEO_DIR:./uploads/videos}
questlearn.media.upload-ttl-minutes=${MEDIA_UPLOAD_TTL_MINUTES:15}
questlearn.media.playback-ttl-minutes=${MEDIA_PLAYBACK_TTL_MINUTES:60}
questlearn.media.s3.bucket=${MEDIA_S3_BUCKET:}
questlearn.media.s3.region=${MEDIA_S3_REGION:auto}
questlearn.media.s3.endpoint=${MEDIA_S3_ENDPOINT:}
questlearn.media.s3.access-key=${MEDIA_S3_ACCESS_KEY:}
questlearn.media.s3.secret-key=${MEDIA_S3_SECRET_KEY:}
questlearn.media.s3.path-style=${MEDIA_S3_PATH_STYLE:false}
questlearn.media.max-video-bytes=${MEDIA_MAX_VIDEO_BYTES:104857600}

# --- Actuator --------------------------------------------------------------
# Health for the uptime probe, metrics for the operator. SecurityConfig keeps
# /actuator/health public and every other actuator endpoint behind the ADMIN role.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
# Tail latency for the admin telemetry view. Without these the timer only reports
# a count and a total, which cannot answer "is it slow right now?".
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
# Mail is an optional extra (recovery and confirmation links). With no provider
# configured the auto mail check would report DOWN and turn /actuator/health into
# a 503, which would page someone about a feature nobody switched on.
management.health.mail.enabled=false

# --- OpenAPI ---------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Misc ------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
logging.level.org.hibernate.SQL=warn
logging.level.com.questlearn=INFO
# Every line written while a request runs carries its correlation id, so a support
# report quoting X-Request-Id can be matched to the exact log lines.
logging.pattern.level=%5p [%X{requestId:-}]
