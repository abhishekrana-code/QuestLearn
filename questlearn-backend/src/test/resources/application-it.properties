# ---------------------------------------------------------------------------
# Integration-test profile: a real PostgreSQL database, no demo seeder.
# ---------------------------------------------------------------------------
# The test class is skipped unless IT_DB_URL is set, so a normal `mvn verify`
# on a machine without PostgreSQL still passes.
spring.datasource.url=${IT_DB_URL}
spring.datasource.username=${IT_DB_USER}
spring.datasource.password=${IT_DB_PASSWORD}

# Flyway owns the schema, exactly as in production; Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# A test-only signing key. Never reuse this value anywhere real.
questlearn.jwt.secret=integration-test-secret-0123456789abcdefghijkl

# Production-shaped registration rules, so the code gate is exercised.
questlearn.registration.student-invite-code=TEST-CODE-1234
questlearn.registration.require-student-code=true
questlearn.registration.instructor-invite-code=

# No Groq key: the AI endpoints must answer 503 without one, and the quiz
# scenarios in this suite never call them.
questlearn.ai.groq-api-key=
