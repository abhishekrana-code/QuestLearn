name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # A public repository cannot take a credential back. This job runs the same
  # scanner as the local pre-commit hook over the working tree and every commit,
  # so a secret added with --no-verify, or added before the hook existed, still
  # fails the build. Without fetch-depth 0 the history is one commit deep and the
  # history scan passes by seeing nothing.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Refuse env files and key-shaped strings
        run: sh scripts/secret-scan.sh --tree --history

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: questlearn_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IT_DB_URL: jdbc:postgresql://localhost:5432/questlearn_it
      IT_DB_USER: postgres
      IT_DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and PostgreSQL integration tests
        run: mvn -B verify
        working-directory: questlearn-backend
      # `mvn verify` stays green when the integration class is skipped, which is
      # exactly what it would do if the database were missing. Fail loudly instead,
      # so a green run always means the PostgreSQL suite really executed.
      - name: Prove the PostgreSQL suite executed
        run: |
          report=questlearn-backend/target/surefire-reports/TEST-com.questlearn.QuestLearnApiIntegrationTest.xml
          test -f "$report"
          if grep -q 'skipped="[1-9]' "$report"; then
            echo "Integration tests were skipped - the database was not reachable."
            exit 1
          fi
          # Guard a floor, not an exact count, so adding a test does not break CI.
          tests=$(grep -o 'tests="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
          if [ "$tests" -lt 10 ]; then
            echo "Expected at least 10 integration tests, found $tests."
            exit 1
          fi
          echo "PostgreSQL integration suite ran: $tests tests, 0 skipped."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: questlearn-frontend/package-lock.json
      - name: Install from the lockfile
        run: npm ci
        working-directory: questlearn-frontend
      - name: Unit tests
        run: npm test
        working-directory: questlearn-frontend
      - name: Production build
        run: npm run build
        working-directory: questlearn-frontend

  # The smoke suite is the only check that drives the real pages against the real
  # API, so it gets its own job with a database and a running jar. It is kept apart
  # from the frontend job so a slow browser download never delays the unit tests.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: questlearn_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/questlearn_e2e
      DB_USERNAME: postgres
      DB_PASSWORD: ci
      JWT_SECRET: ci-only-e2e-secret-not-used-anywhere-else-0123456789
      CORS_ORIGINS: http://localhost:5180
      # The seeder gives a fresh database a random demo password unless this is
      # set, and the smoke suite signs in as the seeded instructor.
      DEMO_PASSWORD: ci-demo-password-2026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: questlearn-frontend/package-lock.json
      - name: Build the API jar
        run: mvn -B -DskipTests package
        working-directory: questlearn-backend
      - name: Start the API on :8091
        run: |
          nohup java -jar questlearn-backend/target/questlearn-1.0.0.jar --server.port=8091 > api-e2e.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8091/actuator/health > /dev/null; then
              echo "API ready after ${attempt} attempts."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy; last log lines:"
          tail -50 api-e2e.log
          exit 1
      - name: Prove the seeded demo login works
        run: |
          body="{\"email\":\"instructor@questlearn.dev\",\"password\":\"$DEMO_PASSWORD\"}"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8091/api/v1/auth/login -H 'Content-Type: application/json' -d "$body")
          if [ "$code" != "200" ]; then
            echo "The seeded instructor could not sign in with DEMO_PASSWORD (HTTP $code)."
            echo "Password lines from the API log, so a generated password is visible here:"
            grep -i "password" api-e2e.log | tail -3
            exit 1
          fi
          echo "Seeded instructor sign-in works."
      - name: Install from the lockfile
        run: npm ci
        working-directory: questlearn-frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: questlearn-frontend
      - name: Smoke suite
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee ../e2e.log
        working-directory: questlearn-frontend
        env:
          CI: true
      # Job logs need authentication to read, including for a public repository,
      # which makes a failing run hard to diagnose from a laptop. Annotations are
      # readable through the public API, so the failure is republished here.
      - name: Report the failing specs as annotations
        if: failure()
        run: |
          set -uo pipefail
          [ -f e2e.log ] || { echo "::error title=e2e::No e2e log was captured."; exit 0; }
          grep -aE "^[[:space:]]+[0-9]+\) |Error: |TypeError|Received|At \(.*spec\.js" e2e.log \
            | head -40 \
            | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/::/:/g' | cut -c1-240)
                echo "::error title=e2e::$clean"
              done || true
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            questlearn-frontend/playwright-report
            questlearn-frontend/test-results
          retention-days: 7
      - name: Show the API log
        if: failure()
        run: tail -80 api-e2e.log
