name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: questlearn_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IT_DB_URL: jdbc:postgresql://localhost:5432/questlearn_it
      IT_DB_USER: postgres
      IT_DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and PostgreSQL integration tests
        run: mvn -B verify
        working-directory: questlearn-backend
      # `mvn verify` stays green when the integration class is skipped, which is
      # exactly what it would do if the database were missing. Fail loudly instead,
      # so a green run always means the PostgreSQL suite really executed.
      - name: Prove the PostgreSQL suite executed
        run: |
          report=questlearn-backend/target/surefire-reports/TEST-com.questlearn.QuestLearnApiIntegrationTest.xml
          test -f "$report"
          if grep -q 'skipped="[1-9]' "$report"; then
            echo "Integration tests were skipped - the database was not reachable."
            exit 1
          fi
          # Guard a floor, not an exact count, so adding a test does not break CI.
          tests=$(grep -o 'tests="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
          if [ "$tests" -lt 10 ]; then
            echo "Expected at least 10 integration tests, found $tests."
            exit 1
          fi
          echo "PostgreSQL integration suite ran: $tests tests, 0 skipped."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: questlearn-frontend/package-lock.json
      - name: Install from the lockfile
        run: npm ci
        working-directory: questlearn-frontend
      - name: Unit tests
        run: npm test
        working-directory: questlearn-frontend
      - name: Production build
        run: npm run build
        working-directory: questlearn-frontend

  # The smoke suite is the only check that drives the real pages against the real
  # API, so it gets its own job with a database and a running jar. It is kept apart
  # from the frontend job so a slow browser download never delays the unit tests.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: questlearn_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/questlearn_e2e
      DB_USERNAME: postgres
      DB_PASSWORD: ci
      JWT_SECRET: ci-only-e2e-secret-not-used-anywhere-else-0123456789
      CORS_ORIGINS: http://localhost:5180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: questlearn-frontend/package-lock.json
      - name: Build the API jar
        run: mvn -B -DskipTests package
        working-directory: questlearn-backend
      - name: Start the API on :8091
        run: |
          nohup java -jar questlearn-backend/target/questlearn-1.0.0.jar --server.port=8091 > api-e2e.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:8091/actuator/health > /dev/null; then
              echo "API ready after ${attempt} attempts."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy; last log lines:"
          tail -50 api-e2e.log
          exit 1
      - name: Install from the lockfile
        run: npm ci
        working-directory: questlearn-frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: questlearn-frontend
      - name: Smoke suite
        run: npm run test:e2e
        working-directory: questlearn-frontend
        env:
          CI: true
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            questlearn-frontend/playwright-report
            questlearn-frontend/test-results
          retention-days: 7
      - name: Show the API log
        if: failure()
        run: tail -80 api-e2e.log
